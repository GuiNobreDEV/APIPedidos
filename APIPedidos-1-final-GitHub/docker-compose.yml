services:
  pedidos:
    build: .
    container_name: pedidos
    environment:
      DATABASE_URL: postgresql+psycopg2://pedidos:pedidos@postgres:5432/pedidos
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rede-pedidos
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
      POSTGRES_DB: pedidos
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - rede-pedidos
    restart: unless-stopped

volumes:
  dados_postgres:

networks:
  rede-pedidos:
    driver: bridge
